<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>arobase — Supervision multi-sites</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%237C8CFF'/%3E%3Ctext x='16' y='23' font-family='Archivo,sans-serif' font-size='22' font-weight='800' text-anchor='middle' fill='%230A161E'%3E@%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0A161E; --panel:#0F212D; --panel-2:#153040; --panel-3:#1B3D50;
  --line:#1E3A4C; --line-soft:rgba(255,255,255,.07);
  --text:#E6F1F6; --dim:#93AFBE; --faint:#5F7D8C;
  --accent:#7C8CFF; --accent-2:#A6B0FF; --accent-dim:rgba(124,140,255,.14);
  --ok:#34C77B; --warn:#F2B33D; --crit:#FF5F56; --idle:#33505F; --info:#4FC3E8;
  --r:10px; --r-sm:6px;
  --f-ui:"Instrument Sans",system-ui,sans-serif;
  --f-dis:"Archivo",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,monospace;
  --rail:236px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--ink); color:var(--text); font-family:var(--f-ui);
  font-size:14px; line-height:1.45; -webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(124,140,255,.07), transparent 60%);
  background-attachment:fixed;
}
h1,h2,h3,h4{font-family:var(--f-dis);margin:0;letter-spacing:-.02em}
a{color:inherit}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px;border-radius:4px}
::selection{background:var(--accent);color:#0A161E}
/* ---------- scrollbars ---------- */
*::-webkit-scrollbar{width:9px;height:9px}
*::-webkit-scrollbar-track{background:transparent}
*::-webkit-scrollbar-thumb{background:#22485D;border-radius:8px}
*::-webkit-scrollbar-thumb:hover{background:#2F6280}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:var(--rail) 1fr;min-height:100vh}
.rail{
  border-right:1px solid var(--line);background:rgba(8,18,25,.72);
  position:sticky;top:0;height:100vh;display:flex;flex-direction:column;
}
.brand{padding:18px 18px 14px;border-bottom:1px solid var(--line);display:flex;gap:11px;align-items:center}
.brand .mark{width:30px;height:30px;border-radius:7px;background:linear-gradient(150deg,var(--accent),#4E5ED6);display:grid;place-items:center;flex:none;box-shadow:0 0 0 1px rgba(255,255,255,.12) inset}
.brand .mark{font-family:var(--f-dis);font-weight:800;font-size:19px;line-height:1;color:#0A161E;padding-bottom:2px}
.brand b{font-family:var(--f-dis);font-weight:800;font-size:17px;letter-spacing:-.01em;display:block;line-height:1.1}
.brand small{font-family:var(--f-mono);font-size:10px;color:var(--faint);letter-spacing:.13em;text-transform:uppercase}
.nav{overflow-y:auto;padding:12px 10px 20px;flex:1}
.nav-group{margin:14px 0 6px;padding:0 8px;font-family:var(--f-mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.nav-item{
  width:100%;display:flex;align-items:center;gap:10px;padding:8px 9px;border-radius:var(--r-sm);
  color:var(--dim);text-align:left;transition:background .14s,color .14s;position:relative;
}
.nav-item:hover{background:rgba(255,255,255,.04);color:var(--text)}
.nav-item.on{background:var(--accent-dim);color:#fff}
.nav-item.on::before{content:"";position:absolute;left:-10px;top:8px;bottom:8px;width:2px;background:var(--accent);border-radius:0 2px 2px 0}
.nav-item .led{flex:none}
.nav-item .k{margin-left:auto;font-family:var(--f-mono);font-size:10px;color:var(--faint)}
.rail-foot{border-top:1px solid var(--line);padding:12px 14px;display:flex;gap:10px;align-items:center}
.avatar{width:28px;height:28px;border-radius:7px;background:var(--panel-3);display:grid;place-items:center;font-family:var(--f-mono);font-size:11px;color:var(--accent-2);flex:none}

/* ---------- topbar ---------- */
.main{min-width:0;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:14px;
  padding:12px 22px;border-bottom:1px solid var(--line);
  background:rgba(10,22,30,.86);backdrop-filter:blur(10px);
}
.crumb{font-family:var(--f-mono);font-size:11px;color:var(--faint);letter-spacing:.06em}
.crumb b{color:var(--dim);font-weight:500}
.search{
  margin-left:auto;display:flex;align-items:center;gap:8px;background:var(--panel);
  border:1px solid var(--line);border-radius:8px;padding:6px 10px;min-width:230px;color:var(--faint)
}
.search input{background:none;border:0;color:var(--text);font-family:var(--f-ui);font-size:13px;width:100%;outline:none}
.search kbd{font-family:var(--f-mono);font-size:10px;border:1px solid var(--line);border-radius:4px;padding:1px 4px;color:var(--faint)}
.pill{
  display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--panel);
  border-radius:999px;padding:5px 12px;font-family:var(--f-mono);font-size:11px;color:var(--dim);white-space:nowrap
}
.pill.crit{border-color:rgba(255,95,86,.4);background:rgba(255,95,86,.1);color:#FFB3AE}
.view{padding:22px;max-width:1560px;width:100%;animation:in .3s ease both}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- primitives ---------- */
.led{width:9px;height:9px;border-radius:2px;background:var(--idle);display:inline-block;flex:none}
.led.ok{background:var(--ok);box-shadow:0 0 7px rgba(52,199,123,.55)}
.led.warn{background:var(--warn);box-shadow:0 0 7px rgba(242,179,61,.5)}
.led.crit{background:var(--crit);box-shadow:0 0 8px rgba(255,95,86,.6);animation:blink 1.6s steps(1,end) infinite}
.led.info{background:var(--info)}
@keyframes blink{0%,60%{opacity:1}61%,100%{opacity:.28}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);position:relative}
.card-h{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line)}
.card-h h3{font-size:14px;font-weight:700}
.card-h .sub{font-family:var(--f-mono);font-size:10.5px;color:var(--faint);letter-spacing:.05em}
.card-h .right{margin-left:auto;display:flex;gap:8px;align-items:center}
.card-b{padding:16px}
.grid{display:grid;gap:14px}
.eyebrow{font-family:var(--f-mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--faint)}
.page-h{display:flex;align-items:flex-end;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.page-h h1{font-size:25px;font-weight:800}
.page-h p{margin:4px 0 0;color:var(--dim);max-width:70ch}
.page-h .right{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.btn{
  display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--panel-2);
  padding:7px 13px;border-radius:8px;font-size:13px;font-weight:500;color:var(--text);transition:.14s
}
.btn:hover{background:var(--panel-3);border-color:#2C5A75}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#0A161E;font-weight:600}
.btn.primary:hover{background:var(--accent-2)}
.btn.ghost{background:transparent}
.btn.danger{border-color:rgba(255,95,86,.45);color:#FFB3AE;background:rgba(255,95,86,.09)}
.btn.sm{padding:4px 9px;font-size:12px}
select.btn{appearance:none;padding-right:26px;background-image:linear-gradient(45deg,transparent 50%,var(--dim) 50%),linear-gradient(135deg,var(--dim) 50%,transparent 50%);background-position:calc(100% - 14px) 52%,calc(100% - 9px) 52%;background-size:5px 5px,5px 5px;background-repeat:no-repeat}
select option{background:#12242F;color:var(--text)}
.tag{font-family:var(--f-mono);font-size:10px;letter-spacing:.05em;padding:2px 7px;border-radius:4px;background:var(--panel-2);color:var(--dim);border:1px solid var(--line);white-space:nowrap}
.tag.ok{color:#8DE7B7;border-color:rgba(52,199,123,.35);background:rgba(52,199,123,.1)}
.tag.warn{color:#FFD98A;border-color:rgba(242,179,61,.35);background:rgba(242,179,61,.1)}
.tag.crit{color:#FFB3AE;border-color:rgba(255,95,86,.35);background:rgba(255,95,86,.1)}
.tag.acc{color:var(--accent-2);border-color:rgba(124,140,255,.4);background:var(--accent-dim)}
.mono{font-family:var(--f-mono)}
.dim{color:var(--dim)} .faint{color:var(--faint)}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
hr.sep{border:0;border-top:1px solid var(--line);margin:16px 0}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:14px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 15px;position:relative;overflow:hidden}
.kpi .lab{font-family:var(--f-mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--faint)}
.kpi .val{font-family:var(--f-dis);font-weight:800;font-size:30px;letter-spacing:-.03em;line-height:1.15;margin-top:5px}
.kpi .sub{font-size:12px;color:var(--dim);margin-top:2px}
.kpi .spark{position:absolute;right:0;bottom:0;opacity:.55}

/* tables */
table{width:100%;border-collapse:collapse}
th{
  text-align:left;font-family:var(--f-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--faint);font-weight:500;padding:9px 14px;border-bottom:1px solid var(--line);white-space:nowrap
}
td{padding:10px 14px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
tbody tr:hover{background:rgba(255,255,255,.025)}
tbody tr:last-child td{border-bottom:0}
.tw{overflow-x:auto}
.rowlink{cursor:pointer}

/* faceplate (signature) */
.faceplate{background:#08131A;border:1px solid var(--line);border-radius:8px;padding:14px;overflow-x:auto}
.fp-rows{display:flex;flex-direction:column;gap:4px;min-width:max-content}
.fp-row{display:flex;gap:4px}
.fp-grp{display:flex;gap:4px;padding-right:9px;margin-right:5px;border-right:1px dashed #1C3646}
.fp-grp:last-child{border-right:0}
.port{
  width:22px;height:19px;border-radius:3px;background:#12242F;border:1px solid #22404F;
  display:grid;place-items:center;cursor:pointer;position:relative;transition:.12s
}
.port:hover{transform:translateY(-2px);border-color:var(--accent)}
.port.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-dim)}
.port i{width:7px;height:7px;border-radius:1.5px;background:var(--idle);display:block}
.port.up i{background:var(--ok);box-shadow:0 0 6px rgba(52,199,123,.6)}
.port.err i{background:var(--warn);box-shadow:0 0 6px rgba(242,179,61,.6)}
.port.down i{background:var(--crit);box-shadow:0 0 6px rgba(255,95,86,.6)}
.port.sfp{width:30px;background:#0E1E28}
.fp-legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;font-family:var(--f-mono);font-size:10.5px;color:var(--faint)}
.fp-legend span{display:flex;align-items:center;gap:6px}

/* site cards */
.sites{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px}
.site{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:15px;cursor:pointer;transition:.15s;position:relative;overflow:hidden}
.site:hover{border-color:#2E5C77;transform:translateY(-2px)}
.site::after{content:"";position:absolute;inset:0 0 auto 0;height:2px;background:var(--ok)}
.site.warn::after{background:var(--warn)} .site.crit::after{background:var(--crit)}
.site .name{font-family:var(--f-dis);font-weight:700;font-size:16px}
.site .meta{font-family:var(--f-mono);font-size:10.5px;color:var(--faint);letter-spacing:.05em}
.ledstrip{display:flex;gap:3px;flex-wrap:wrap;margin:12px 0 10px}
.ledstrip i{width:11px;height:11px;border-radius:2px;background:var(--idle)}
.ledstrip i.ok{background:var(--ok)} .ledstrip i.warn{background:var(--warn)} .ledstrip i.crit{background:var(--crit)}
.minirow{display:flex;gap:14px;font-size:12px;color:var(--dim);flex-wrap:wrap}
.minirow b{color:var(--text);font-family:var(--f-mono);font-weight:500}

/* bars / meters */
.meter{height:6px;border-radius:4px;background:#0C1D27;overflow:hidden;border:1px solid var(--line)}
.meter i{display:block;height:100%;background:var(--accent);border-radius:4px}
.meter i.ok{background:var(--ok)} .meter i.warn{background:var(--warn)} .meter i.crit{background:var(--crit)}
.mline{display:flex;align-items:center;gap:10px;margin:9px 0}
.mline .l{width:112px;font-size:12px;color:var(--dim);flex:none}
.mline .m{flex:1} .mline .v{width:74px;text-align:right;font-family:var(--f-mono);font-size:12px}

/* alerts / feed */
.feed{display:flex;flex-direction:column}
.ev{display:flex;gap:12px;padding:11px 16px;border-bottom:1px solid var(--line-soft);align-items:flex-start}
.ev:last-child{border-bottom:0}
.ev .t{font-family:var(--f-mono);font-size:10.5px;color:var(--faint);white-space:nowrap;padding-top:2px}
.ev .body{flex:1;min-width:0}
.ev .title{font-size:13px;font-weight:500}
.ev .sub{font-size:12px;color:var(--dim);margin-top:2px}
.ev .act{display:flex;gap:6px;align-items:center}
.corr{margin:8px 0 0;padding:8px 10px;border-left:2px solid var(--line);background:rgba(255,255,255,.02);border-radius:0 6px 6px 0;font-size:12px;color:var(--dim)}

/* backup calendar */
.cal{display:grid;grid-template-columns:repeat(30,1fr);gap:3px;min-width:420px}
.cal i{aspect-ratio:1;border-radius:2px;background:var(--idle);cursor:pointer;transition:.12s}
.cal i:hover{transform:scale(1.35);z-index:2}
.cal i.ok{background:var(--ok)} .cal i.warn{background:var(--warn)} .cal i.crit{background:var(--crit)} .cal i.none{background:#1B2E3A}

/* terminal */
.term{background:#061117;border:1px solid var(--line);border-radius:0 0 var(--r) var(--r);padding:14px;font-family:var(--f-mono);font-size:12.5px;line-height:1.65;height:390px;overflow-y:auto}
.term .p{color:var(--ok)} .term .c{color:var(--text)} .term .o{color:var(--dim);white-space:pre-wrap}
.term-in{display:flex;gap:8px;align-items:center;margin-top:2px}
.term-in input{flex:1;background:none;border:0;outline:none;color:var(--text);font-family:var(--f-mono);font-size:12.5px}
.rec{display:inline-flex;align-items:center;gap:6px;color:#FFB3AE;font-family:var(--f-mono);font-size:10.5px}
.rec i{width:7px;height:7px;border-radius:50%;background:var(--crit);animation:blink 1.4s infinite}

/* topology */
.topo{background:#08131A;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.topo svg{display:block;width:100%;height:auto}
.node rect,.node circle{transition:.15s}
.node:hover rect{stroke:var(--accent)}
.link{stroke:#2A5064;stroke-width:1.6}
.link.hot{stroke:var(--accent);stroke-width:2;stroke-dasharray:5 5;animation:flow 1s linear infinite}
.link.down{stroke:var(--crit);stroke-dasharray:3 4}
@keyframes flow{to{stroke-dashoffset:-20}}

/* discovery console */
.disc{background:#061117;border:1px solid var(--line);border-radius:8px;padding:14px;font-family:var(--f-mono);font-size:12px;height:250px;overflow-y:auto;line-height:1.7}
.disc .l{display:flex;gap:9px}
.disc .l b{color:var(--accent-2);font-weight:500}

/* modal */
.mask{position:fixed;inset:0;background:rgba(4,10,14,.72);backdrop-filter:blur(3px);z-index:80;display:grid;place-items:center;padding:20px;animation:in .18s ease both}
.modal{background:var(--panel);border:1px solid var(--panel-3);border-radius:14px;width:min(560px,100%);max-height:88vh;overflow-y:auto;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.modal .m-h{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.modal .m-b{padding:18px}
.modal .m-f{padding:14px 18px;border-top:1px solid var(--line);display:flex;gap:9px;justify-content:flex-end;background:rgba(0,0,0,.15)}
.field{margin:12px 0}
.field label{display:block;font-family:var(--f-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin-bottom:6px}
.field input,.field select,.field textarea{
  width:100%;background:#0A1B24;border:1px solid var(--line);border-radius:7px;padding:9px 11px;
  color:var(--text);font-family:var(--f-mono);font-size:13px;outline:none
}
.field input:focus,.field select:focus{border-color:var(--accent)}
.check{display:flex;gap:9px;align-items:flex-start;font-size:13px;color:var(--dim);margin:9px 0;cursor:pointer}
.check input{margin-top:3px;accent-color:var(--accent)}
.warnbox{border:1px solid rgba(242,179,61,.35);background:rgba(242,179,61,.08);border-radius:8px;padding:11px 13px;font-size:12.5px;color:#FFD98A}
.critbox{border:1px solid rgba(255,95,86,.35);background:rgba(255,95,86,.08);border-radius:8px;padding:11px 13px;font-size:12.5px;color:#FFB3AE}
.okbox{border:1px solid rgba(52,199,123,.3);background:rgba(52,199,123,.07);border-radius:8px;padding:11px 13px;font-size:12.5px;color:#8DE7B7}

/* tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tab{padding:8px 13px;border-radius:7px 7px 0 0;color:var(--dim);font-size:13px;white-space:nowrap;border-bottom:2px solid transparent}
.tab.on{color:#fff;border-bottom-color:var(--accent);background:linear-gradient(180deg,transparent,var(--accent-dim))}

/* misc layout helpers */
.row{display:flex;gap:14px;flex-wrap:wrap}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px}
.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.c4{grid-template-columns:repeat(4,minmax(0,1fr))}
.split{grid-template-columns:minmax(0,1.55fr) minmax(0,1fr)}
.split-r{grid-template-columns:minmax(0,1fr) minmax(0,1.7fr)}
.phase2{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;color:#0A161E;background:var(--accent);padding:3px 8px;border-radius:5px;font-weight:600}
.toast{position:fixed;right:20px;bottom:20px;z-index:90;background:var(--panel-2);border:1px solid var(--panel-3);border-left:3px solid var(--ok);border-radius:10px;padding:12px 16px;box-shadow:0 16px 40px rgba(0,0,0,.5);animation:in .2s ease both;max-width:360px}
.empty{padding:34px;text-align:center;color:var(--faint)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-family:var(--f-mono);font-size:10.5px;color:var(--faint)}
.legend span{display:flex;align-items:center;gap:6px}

@media (max-width:1180px){ .split,.split-r,.c4{grid-template-columns:1fr 1fr} .c3{grid-template-columns:1fr 1fr} }
@media (max-width:880px){
  .app{grid-template-columns:1fr}
  .rail{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}
  .nav{display:flex;gap:6px;overflow-x:auto;padding:10px}
  .nav-group{display:none} .nav-item{width:auto;white-space:nowrap} .nav-item .k{display:none}
  .rail-foot{display:none}
  .split,.split-r,.c2,.c3,.c4{grid-template-columns:1fr}
  .view{padding:16px}
  .search{min-width:0}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="brand">
      <div class="mark">@</div>
      <div>
        <b>arobase</b>
        <small>supervision · v0.9</small>
      </div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="rail-foot">
      <div class="avatar">JM</div>
      <div style="min-width:0">
        <div style="font-size:12.5px;font-weight:500">J. Marchand</div>
        <div class="mono" style="font-size:10px;color:var(--faint)">Administrateur · 2FA</div>
      </div>
    </div>
  </aside>
  <div class="main">
    <header class="topbar">

function serie(n, base, amp, trend = 0) {
  const out = []; let v = base;
  for (let i = 0; i < n; i++) { v += (rnd() - .5) * amp + trend; out.push(Math.max(0, v)); }
  return out;
}
function sparkline(vals, w = 120, h = 34, color = 'var(--accent)', fill = true) {
  const mx = Math.max(...vals), mn = Math.min(...vals), sp = mx - mn || 1;
  const pts = vals.map((v, i) => [i / (vals.length - 1) * w, h - 2 - ((v - mn) / sp) * (h - 6)]);
  const d = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  const area = d + ` L${w} ${h} L0 ${h} Z`;
  return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true">
    ${fill ? `<path d="${area}" fill="${color}" opacity=".12"/>` : ''}
    <path d="${d}" fill="none" stroke="${color}" stroke-width="1.6" stroke-linejoin="round"/></svg>`;
}
function areaChart(series, w = 640, h = 170, labels = []) {
  const all = series.flatMap(s => s.v), mx = Math.max(...all) * 1.12, mn = 0;
  const x = i => 34 + i / (series[0].v.length - 1) * (w - 46);
  const y = v => h - 26 - (v - mn) / (mx - mn || 1) * (h - 40);
  let grid = '';
  for (let g = 0; g <= 4; g++) {
    const gy = 14 + g * (h - 40) / 4, val = (mx - g * mx / 4);
    grid += `<line x1="34" y1="${gy}" x2="${w - 8}" y2="${gy}" stroke="var(--line)" stroke-width="1"/>
      <text x="28" y="${gy + 3.5}" text-anchor="end" fill="var(--faint)" font-size="9" font-family="IBM Plex Mono">${val >= 100 ? Math.round(val) : val.toFixed(0)}</text>`;
  }
  const paths = series.map(s => {
    const d = s.v.map((v, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(v).toFixed(1)).join(' ');
    return `<path d="${d} L${x(s.v.length - 1)} ${h - 26} L${x(0)} ${h - 26} Z" fill="${s.c}" opacity=".10"/>
            <path d="${d}" fill="none" stroke="${s.c}" stroke-width="1.8" stroke-linejoin="round"/>`;
  }).join('');
  const xl = labels.map((l, i) => `<text x="${x(i * (series[0].v.length - 1) / (labels.length - 1))}" y="${h - 8}" text-anchor="middle" fill="var(--faint)" font-size="9" font-family="IBM Plex Mono">${l}</text>`).join('');
  const leg = series.map((s, i) => `<g transform="translate(${44 + i * 118},${h - 8})"><rect x="0" y="-7" width="8" height="8" rx="2" fill="${s.c}"/><text x="13" y="0" fill="var(--dim)" font-size="10" font-family="IBM Plex Mono">${s.n}</text></g>`).join('');
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" style="display:block">${grid}${paths}${labels.length ? xl : leg}</svg>`;
}
function meter(label, val, unit = '%', th = [70, 90]) {
  const cls = val >= th[1] ? 'crit' : val >= th[0] ? 'warn' : 'ok';
  return `<div class="mline"><div class="l">${label}</div><div class="m"><div class="meter"><i class="${cls}" style="width:${Math.min(100, val)}%"></i></div></div><div class="v">${val}${unit}</div></div>`;
}

function cliRun(cmd) {
  const term = document.getElementById('term'), inp = document.getElementById('termIn');
  const c = cmd.trim();
  if (c === 'clear') { term.querySelectorAll('.blk').forEach(n => n.remove()); inp.value = ''; return; }
  const out = CLI_HELP[c] !== undefined ? CLI_HELP[c] : `% Commande inconnue dans cette maquette : « ${esc(c)} ». Tapez « help ».`;
  const blk = document.createElement('div');
  blk.className = 'blk';
  blk.innerHTML = `<div><span class="p">${CLI_TARGET}#</span> <span class="c">${esc(c)}</span></div><div class="o">${esc(out)}</div>`;
  term.insertBefore(blk, term.lastElementChild);
  inp.value = ''; term.scrollTop = term.scrollHeight;
}

      <button class="btn" data-toast="Simulation terminée : 2 412 fichiers (41 Go) seraient restaurés.">Simuler</button>
      <button class="btn danger" id="doRestore">Restaurer</button>
    </div>
  </div>`,
  maint: () => `<div class="modal" onclick="event.stopPropagation()">
    <div class="m-h"><h3>Fenêtre de maintenance</h3></div>

      <div class="field"><label>Périmètre</label><select><option>Un site entier</option><option>Un équipement</option><option>Un groupe</option></select></div>
      <div class="field"><label>Site</label><select>${SITES.map(s => `<option>${s.nom}</option>`).join('')}</select></div>
      <div class="row"><div class="field" style="flex:1"><label>Début</label><input value="03/08/2026 20:00"></div>
      <div class="field" style="flex:1"><label>Fin</label><input value="03/08/2026 23:00"></div></div>
      <div class="field"><label>Motif (visible dans l'audit)</label><input value="Remplacement du switch d'étage"></div>
      <label class="check"><input type="checkbox" checked> Suspendre les notifications (la collecte continue)</label>

    </div>
    <div class="m-f"><button class="btn ghost" data-close-btn>Annuler</button><button class="btn primary" data-toast="Fenêtre de maintenance planifiée.">Planifier</button></div>
  </div>`,
  rule: () => `<div class="modal" onclick="event.stopPropagation()">
    <div class="m-h"><h3>Règle d'alerte</h3></div>
    <div class="m-b">
      <div class="field"><label>Métrique</label><select><option>Température du châssis</option><option>Erreurs CRC par port</option><option>Espace disque</option><option>Sauvegarde non exécutée</option></select></div>
      <div class="row"><div class="field" style="flex:1"><label>Avertissement</label><input value="> 55 °C pendant 5 min"></div>
      <div class="field" style="flex:1"><label>Critique</label><input value="> 65 °C"></div></div>
      <div class="field"><label>Périmètre</label><select><option>Tous les switches</option><option>Un site</option><option>Un équipement</option></select></div>
      <div class="field"><label>Notification</label><select><option>E-mail + Teams</option><option>E-mail + SMS astreinte</option><option>Webhook ITSM</option></select></div>
      <label class="check"><input type="checkbox" checked> Regrouper avec les alertes corrélées du même équipement</label>
      <label class="check"><input type="checkbox" checked> Escalader si non acquittée après 15 minutes</label>

    <div class="m-f"><button class="btn ghost" data-close-btn>Annuler</button><button class="btn primary" data-toast="Règle enregistrée.">Enregistrer</button></div>

  autorules: () => `<div class="modal" onclick="event.stopPropagation()">
    <div class="m-h"><span class="phase2">Phase 2</span><h3>Actions automatiques autorisées</h3></div>
    <div class="m-b">
      <p class="dim" style="margin:0 0 10px">L'auto-remédiation n'exécute que ce qui est coché ici. Tout le reste est proposé au technicien sans être lancé.</p>
      <label class="check"><input type="checkbox" checked> Relancer une sauvegarde échouée (1 tentative)</label>
      <label class="check"><input type="checkbox" checked> Redémarrer un service applicatif surveillé</label>

/* ============================================================
   Découverte animée
   ============================================================ */
const DISC_STEPS = [
  ['00.0','Connexion SNMPv3 à 10.60.0.1…'],
  ['00.4','Cœur identifié : Cisco C9300-24P · IOS-XE 17.09.04a · série FCW2451K1PP'],
  ['01.1','Lecture de la table de voisinage LLDP : 4 voisins'],
  ['01.6','→ EVX-ETG1-SW02 (10.60.0.11) · Cisco C9200-24P'],
  ['02.0','→ EVX-ETG2-SW03 (10.60.0.12) · HPE 2930F-24G'],
  ['02.4','→ EVX-WIFI-SW04 (10.60.0.13) · Cisco C1000-8P'],
  ['02.9','Descente niveau 2 : lecture des voisins de chaque switch…'],
  ['03.5','→ EVX-SRV-01 (10.60.1.10) · Dell R450 · Redfish détecté'],
  ['04.0','→ EVX-NAS-01 (10.60.1.20) · Synology · SNMP détecté'],
  ['04.6','Lecture des tables CAM : 63 adresses MAC sur 4 switches'],
  ['05.2','Relevé des VLAN : 5 VLAN (10, 20, 30, 40, 99)'],
  ['05.8','Relevé des ports : 88 ports · 41 actifs · 47 libres'],
  ['06.3','Vérification des firmwares contre la base CVE : 1 alerte'],
  ['06.9','Topologie reconstruite · 11 équipements · 12 liens'],
  ['07.2','✓ Découverte terminée. Site prêt à être supervisé.'],
];
function runDiscovery() {
  const log = document.getElementById('discLog'); if (!log) return;
  log.innerHTML = ''; let i = 0;
  const t = setInterval(() => {
    if (i >= DISC_STEPS.length) { clearInterval(t); toast('Site ajouté : 11 équipements découverts.'); return; }
    const [s, txt] = DISC_STEPS[i++];
    const d = document.createElement('div');
    d.className = 'l';
    d.innerHTML = `<b>${s}s</b><span style="color:${txt.startsWith('✓') ? 'var(--ok)' : txt.startsWith('→') ? 'var(--text)' : 'var(--dim)'}">${esc(txt)}</span>`;
    log.appendChild(d); log.scrollTop = log.scrollHeight;
  }, 420);
}

/* ============================================================
   Rendu & interactions
   ============================================================ */
const VIEWS = {overview:vOverview, site:vSite, topo:vTopo, inv:vInv, switch:vSwitch, server:vServer,
  backup:vBackup, alerts:vAlerts, cli:vCli, ia:vIa, reports:vReports, admin:vAdmin};
function render() {
  seed = 42;
  document.getElementById('view').innerHTML = VIEWS[CUR]();
  document.getElementById('crumb').innerHTML = CRUMBS[CUR].replace(/\/ (.*)$/, '/ <b>$1</b>');
  const openCrit = ALERTES.filter(a => a.sev === 'crit' && !a.ack).length;
  document.getElementById('alertPill').innerHTML = `<span class="led crit"></span>${openCrit} alertes critiques`;
  document.getElementById('agentPill').innerHTML = `<span class="led ok"></span>6 sites · 5 agents synchronisés`;
  const ss = document.getElementById('siteSel');
  if (ss) ss.onchange = e => { CUR_SITE = e.target.value; render(); };
  const cs = document.getElementById('cliSel');
  if (cs) cs.onchange = e => { CLI_TARGET = e.target.value; render(); };
  const ti = document.getElementById('termIn');
  if (ti) { ti.focus(); ti.onkeydown = e => { if (e.key === 'Enter') cliRun(ti.value); }; }
}
document.addEventListener('click', e => {
  const t = e.target;
  const g = s => t.closest(s);
  if (g('[data-site]')) { CUR_SITE = g('[data-site]').dataset.site; go('site'); return; }
  if (g('[data-eq]')) {
    const id = g('[data-eq]').dataset.eq;
    const eq = eqById(id);
    go(eq && (eq.type.includes('Switch')) ? 'switch' : 'server'); return;
  }
  if (g('[data-cli]')) { CLI_TARGET = g('[data-cli]').dataset.cli; go('cli'); return; }
  if (g('[data-port]')) { SELPORT = +g('[data-port]').dataset.port; render(); return; }
  if (g('[data-bktab]')) { BK_TAB = g('[data-bktab]').dataset.bktab; render(); return; }
  if (g('[data-altab]')) { ALERT_TAB = g('[data-altab]').dataset.altab; render(); return; }
  if (g('[data-admtab]')) { ADM_TAB = g('[data-admtab]').dataset.admtab; render(); return; }
  if (g('[data-ack]')) {
    const a = ALERTES.find(x => x.id === g('[data-ack]').dataset.ack);
    a.ack = true; a.esc = 'Acquittée par J. Marchand à ' + new Date().toTimeString().slice(0, 5);
    render(); toast('Alerte acquittée — escalade annulée.'); return;
  }
  if (g('[data-modal]')) {
    const k = g('[data-modal]').dataset.modal;
    modal(MODALS[k]());
    const db = document.getElementById('discBtn'); if (db) db.onclick = runDiscovery;
    const dr = document.getElementById('doRestore');
    if (dr) dr.onclick = () => {
      const ok = document.getElementById('r1').checked && document.getElementById('r2').checked
        && document.getElementById('r3').value.trim().toUpperCase() === 'CAE-FS-01';
      if (!ok) { toast('Restauration bloquée : les deux confirmations et le nom exact de la machine sont requis.'); return; }
      closeModal(); toast('Restauration lancée via l\'API Veeam. Les équipes concernées ont été prévenues.');
    };
    return;
  }
  if (g('[data-toast]')) { toast(g('[data-toast]').dataset.toast); return; }
  if (g('[data-close-btn]') || t.hasAttribute('data-close')) { closeModal(); return; }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

renderNav(); render();
</script>
